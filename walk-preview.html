<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Новая походка — После дождя</title><style>body{margin:0;background:#edf0e6;color:#354c48;font:18px system-ui;text-align:center}main{max-width:1000px;margin:auto;padding:24px}h1{font:600 30px Georgia}canvas{width:100%;aspect-ratio:1000/560;background:#faf8ee;border-radius:24px}button,a{font:inherit;color:inherit;border:1px solid #a1b5a2;border-radius:16px;padding:10px 18px;background:#fffdf3;margin:5px;cursor:pointer}label{display:block;margin:20px}input{width:60%}p{color:#60746b}</style><main><h1>Новая походка героев</h1><p>Девушка и парень · обычная скорость и замедленный просмотр</p><canvas width="1000" height="560" aria-label="Два героя с новой анимацией ходьбы"></canvas><div><button id="pause">Пауза</button><button id="speed">Замедлить ×4</button><button id="sun">Дождь закончился</button><a href="./">Открыть игру</a></div><label>Положение в шаге <input type="range" id="phase" min="0" max="1" step=".001" value="0"></label></main><script type="module">
import{setCanvasResolution}from'./js/resolution.js';
import{drawGait,CYCLE}from'./js/gait.js?v=7';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),img=new Image();img.src='assets/images/heroes-v2.png';const hoodImg=new Image();hoodImg.src='assets/images/heroes-hood-v2.png';await Promise.all([img.decode(),hoodImg.decode()]);
const people=[{kind:'woman',walk:0,v:101.523,motion:1,hood:-1},{kind:'man',walk:0,v:101.523,motion:1,hood:-1}];let paused=false,slow=false,sunny=false,last=0;
const pause=document.querySelector('#pause'),speed=document.querySelector('#speed'),phase=document.querySelector('#phase');
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Продолжить':'Пауза';};speed.onclick=()=>{slow=!slow;speed.textContent=slow?'Обычная скорость':'Замедлить ×4';};document.querySelector('#sun').onclick=()=>{sunny=!sunny;paused=false;pause.textContent='Пауза';for(const p of people){p.hood=sunny?0:-1;p.motion=sunny?0:1;}};
phase.oninput=()=>{paused=true;pause.textContent='Продолжить';for(const p of people)p.walk=Number(phase.value)*CYCLE;};
function tick(now){const dt=last?Math.min(.04,(now-last)/1000)*(slow?.25:1):0;last=now;setCanvasResolution(canvas,1000,560,canvas.getBoundingClientRect().width/1000,devicePixelRatio||1);ctx.clearRect(0,0,1000,560);ctx.strokeStyle='#d3dccb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,500);ctx.lineTo(970,500);ctx.stroke();for(let i=0;i<2;i++){const p=people[i];if(!paused){if(!sunny)p.walk+=dt;if(p.hood>=0)p.hood+=dt;}ctx.save();ctx.translate(15+i*485,40);ctx.scale(2.24,2.24);drawGait(ctx,p,{heroParts:img,heroHood:hoodImg});ctx.restore();}if(!paused)phase.value=(people[0].walk/CYCLE)%1;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
